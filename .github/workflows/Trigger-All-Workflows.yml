name: Trigger-All-Workflows

on:
  workflow_dispatch:
    inputs:
      ipq60xx_libwrt:
        description: 运行 IPQ60XX-LibWrt (太乙 RE-CS-07)
        required: false
        type: boolean
        default: true
      ipq807x_libwrt:
        description: 运行 IPQ807X-LibWrt (已删除)
        required: false
        type: boolean
        default: false
      jdcloud_immortalwrt:
        description: 运行 JDCloud-ImmortalWrt (已删除)
        required: false
        type: boolean
        default: false
      jdcloud_nowifi_immortalwrt:
        description: 运行 JDCloud-NoWiFi-ImmortalWrt (太乙 RE-CS-07)
        required: false
        type: boolean
        default: true
      x86_64_immortalwrt:
        description: 运行 x86-64-ImmortalWrt (已删除)
        required: false
        type: boolean
        default: false
      build_packages:
        description: 运行 Build-Packages
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read
  actions: read

concurrency:
  group: trigger-all-workflows-${{ github.repository }}
  cancel-in-progress: false

jobs:

    IPQ60XX-LibWrt:
      if: ${{ github.event_name == 'schedule' || inputs.ipq60xx_libwrt }}
      uses: ./.github/workflows/IPQ60XX-LibWrt.yml
      permissions:
        contents: write
        actions: write

    JDCloud-NoWiFi-ImmortalWrt:
      if: ${{ github.event_name == 'schedule' || inputs.jdcloud_nowifi_immortalwrt }}
      uses: ./.github/workflows/JDCloud-NoWiFi-ImmortalWrt.yml
      permissions:
        contents: write
        actions: write

    Build-Packages:
      if: ${{ github.event_name == 'schedule' || inputs.build_packages }}
      uses: ./.github/workflows/Build-Packages.yml
      permissions:
        contents: write
        actions: read
      with:
        sdk_version: ALL
